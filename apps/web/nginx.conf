worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 default_type application/octet-stream;
 # Never put opaque content URLs, query strings, cookies, or request bodies in logs.
 access_log off;
 server_tokens off;
 client_body_temp_path /tmp/client_body;
 proxy_temp_path /tmp/proxy;
 fastcgi_temp_path /tmp/fastcgi;
 uwsgi_temp_path /tmp/uwsgi;
 scgi_temp_path /tmp/scgi;
 client_max_body_size 21m;
 client_body_timeout 25s;
 send_timeout 30s;
 keepalive_timeout 30s;
 server {
  listen 8081;
  include /etc/nginx/vault-tls.conf;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  location = /healthz { return 200 "ok\n"; }
  location = /graphql {
   proxy_pass http://127.0.0.1:8080;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_request_buffering off;
   proxy_buffering off;
   proxy_read_timeout 35s;
  }
  location ~ "^/(shared-)?content/[A-Za-z0-9_-]{43}$" {
   proxy_pass http://127.0.0.1:8080;
   proxy_http_version 1.1;
   proxy_set_header Host $http_host;
   proxy_set_header Connection "";
   proxy_buffering off;
   proxy_read_timeout 35s;
  }
  location /assets/ {
   try_files $uri =404;
   add_header Cache-Control "public, max-age=31536000, immutable";
   add_header X-Content-Type-Options nosniff always;
  }
  location / {
   try_files $uri /index.html;
   add_header Cache-Control no-store always;
   add_header Strict-Transport-Security "max-age=31536000" always;
   add_header X-Content-Type-Options nosniff always;
   add_header Referrer-Policy no-referrer always;
   add_header X-Frame-Options DENY always;
   add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
  }
 }
}
