apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: full-stack-file-vault
resources:
 - namespace.yaml
 - config.yaml
 - storage.yaml
 - application.yaml
 - ingress.yaml
 - network-policy.yaml
images:
 - name: full-stack-file-vault-api
   newName: full-stack-file-vault-api
   newTag: local
 - name: full-stack-file-vault-web
   newName: full-stack-file-vault-web
   newTag: local
