# Optional: requires the Prometheus Operator CRDs and namespace discovery.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
 name: full-stack-file-vault
 namespace: full-stack-file-vault
spec:
 selector:
  matchLabels: { app: full-stack-file-vault, component: application }
 podMetricsEndpoints:
  - port: api
    interval: 15s
    relabelings: [{ targetLabel: job, replacement: full-stack-file-vault-api }]
  - port: gc-metrics
    interval: 15s
    relabelings: [{ targetLabel: job, replacement: full-stack-file-vault-collector }]
