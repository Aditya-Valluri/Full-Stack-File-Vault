global:
 scrape_interval: 15s
 evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yaml]
scrape_configs:
 - job_name: file-vault-api
   static_configs: [{ targets: ["api:8080"] }]
 - job_name: file-vault-collector
   static_configs: [{ targets: ["collector:8082"] }]
# Configure an authenticated Alertmanager destination before production use.
