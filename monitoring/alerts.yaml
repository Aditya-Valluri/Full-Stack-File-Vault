groups:
 - name: full-stack-file-vault
   rules:
    - alert: FullStackFileVaultAPIUnavailable
      expr: up{job="full-stack-file-vault-api"} == 0
      for: 2m
      labels: { severity: critical }
      annotations: { summary: "Full Stack File Vault API metrics endpoint is unavailable" }
    - alert: FullStackFileVaultCollectorUnavailable
      expr: up{job="full-stack-file-vault-collector"} == 0
      for: 2m
      labels: { severity: warning }
      annotations: { summary: "Full Stack File Vault cleanup worker is unavailable" }
    - alert: FullStackFileVaultCleanupStalled
      expr: time() - vault_cleanup_last_success_seconds{job="full-stack-file-vault-collector"} > 180
      for: 2m
      labels: { severity: warning }
      annotations: { summary: "No successful cleanup cycle for more than three minutes" }
    - alert: FullStackFileVaultGraphQLInternalErrors
      expr: increase(vault_graphql_errors_total{job="full-stack-file-vault-api",code="INTERNAL_ERROR"}[5m]) > 0
      for: 1m
      labels: { severity: warning }
      annotations: { summary: "GraphQL returned an internal execution error" }
    - alert: FullStackFileVaultHTTPErrorRate
      expr: sum(rate(vault_http_requests_total{job="full-stack-file-vault-api",status_class="5xx"}[5m])) / clamp_min(sum(rate(vault_http_requests_total{job="full-stack-file-vault-api"}[5m])), 0.001) > 0.05
      for: 5m
      labels: { severity: critical }
      annotations: { summary: "Full Stack File Vault HTTP server error rate exceeds five percent" }
    - alert: FullStackFileVaultDatabaseMetricsUnavailable
      expr: vault_database_metrics_available{job="full-stack-file-vault-api"} == 0
      for: 3m
      labels: { severity: warning }
      annotations: { summary: "Aggregate database monitoring queries are failing" }
    - alert: FullStackFileVaultGarbageBacklog
      expr: vault_gc_pending_bytes{job="full-stack-file-vault-api"} > 1000000000
      for: 30m
      labels: { severity: warning }
      annotations: { summary: "More than 1 GB is waiting for garbage collection" }
    - alert: FullStackFileVaultRetentionGrowth
      expr: vault_cleanup_tombstones{job="full-stack-file-vault-api"} > 1000000 or vault_upload_receipt_storage_bytes{job="full-stack-file-vault-api"} > 100000000
      for: 15m
      labels: { severity: warning }
      annotations: { summary: "Recovery metadata needs a capacity review; do not expire it blindly" }
    - alert: FullStackFileVaultVolumeLowSpace
      expr: kubelet_volume_stats_available_bytes{namespace="full-stack-file-vault",persistentvolumeclaim="full-stack-file-vault-files"} / kubelet_volume_stats_capacity_bytes{namespace="full-stack-file-vault",persistentvolumeclaim="full-stack-file-vault-files"} < 0.15
      for: 5m
      labels: { severity: critical }
      annotations: { summary: "Full Stack File Vault persistent volume has less than fifteen percent free space" }
    - alert: FullStackFileVaultBackupMissing
      expr: time() - vault_backup_last_success_seconds > 90000 or absent(vault_backup_last_success_seconds)
      for: 15m
      labels: { severity: critical }
      annotations: { summary: "No successful verified backup has been reported within 25 hours" }
