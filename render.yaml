# Free, temporary hiring demo. No paid disk or pre-deploy job.
# Use a new Blueprint: never convert an existing disk-backed database in place.
services:
 - type: web
   name: full-stack-file-vault-web
   runtime: docker
   plan: free
   region: virginia
   dockerfilePath: deploy/render/Dockerfile
   dockerContext: .
   dockerCommand: /app/render-demo
   autoDeployTrigger: "off"
   healthCheckPath: /readyz
   envVars:
    - key: DEMO_OPERATOR_URL
      fromDatabase:
       name: full-stack-file-vault-db
       property: connectionString
    - key: DEMO_RUNTIME_SEED
      generateValue: true
    - key: DEMO_GC_SEED
      generateValue: true
    - key: DEMO_REVIEWER_PASSWORD
      generateValue: true
    - key: DEMO_ADMIN_PASSWORD
      generateValue: true
databases:
 - name: full-stack-file-vault-db
   plan: free
   region: virginia
   databaseName: vault_demo
   user: vault_operator
   postgresMajorVersion: "17"
   ipAllowList: []
